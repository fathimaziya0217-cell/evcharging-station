spring.application.name=ev-charging-station-management
server.port=${SERVER_PORT:8085}

# MySQL Database Configuration via Environment Variables with Defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ev_charging_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:ev_app}
spring.datasource.password=${DB_PASSWORD:ev_secure_password_123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Migration with Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Session Security & Management
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Initial Admin Configuration (Initialized securely if not already present in DB)
app.admin.name=${ADMIN_NAME:System Administrator}
app.admin.email=${ADMIN_EMAIL:admin@evcharge.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.phone=${ADMIN_PHONE:+919876543210}

# Payment Gateway Configuration
# Supported Modes: DEMO (simulation for testing/demo) | REAL (Razorpay checkout)
app.payment.mode=${PAYMENT_MODE:DEMO}
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:secret_placeholder}
app.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:webhook_placeholder}

# Logging configuration
logging.level.com.evcharging=INFO
logging.level.org.springframework.jdbc.core=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
