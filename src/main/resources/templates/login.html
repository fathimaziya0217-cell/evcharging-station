<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card card-modern shadow-lg p-4 p-sm-5 border-0">
                        <div class="text-center mb-4">
                            <div class="stat-icon green mx-auto mb-2" style="width: 58px; height: 58px;">
                                <i class="bi bi-lightning-charge-fill fs-3"></i>
                            </div>
                            <h3 class="fw-bold text-dark">Welcome Back</h3>
                            <p class="text-muted small">Sign in to manage your EV bookings and charging sessions</p>
                        </div>

                        <!-- Login Form -->
                        <form th:action="@{/login}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold small">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" name="email" required autofocus placeholder="name@example.com" />
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password" />
                                </div>
                            </div>

                            <button type="submit" class="btn btn-electric w-100 py-2 mt-2">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                            </button>
                        </form>

                        <!-- Demo Test Credentials Box -->
                        <div class="mt-4 p-3 bg-light rounded-3 border small">
                            <div class="fw-bold text-dark mb-1 d-flex align-items-center">
                                <i class="bi bi-info-circle-fill text-primary me-2"></i> Demo Quick Credentials
                            </div>
                            <div class="text-muted" style="font-size: 0.8rem;">
                                <div><strong>Customer:</strong> <code>rahul.ev@gmail.com</code> / <code>User@12345</code></div>
                                <div><strong>Administrator:</strong> <code>admin@evcharge.com</code> / <code>Admin@12345</code></div>
                            </div>
                        </div>

                        <div class="text-center mt-4 small text-muted">
                            Don't have an account? 
                            <a th:href="@{/register}" class="text-decoration-none fw-bold text-success">Register here</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
