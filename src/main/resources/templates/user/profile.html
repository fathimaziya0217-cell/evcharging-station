<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('My Profile & Vehicles')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-4">
        <div class="container">
            <h3 class="fw-bold mb-4"><i class="bi bi-person-gear text-primary me-2"></i>Account Profile &amp; EV Fleet</h3>

            <div class="row g-4">
                <!-- Personal Profile Update -->
                <div class="col-lg-5">
                    <div class="card card-modern p-4 shadow-sm">
                        <h5 class="fw-bold text-dark mb-3">Personal Information</h5>

                        <form th:action="@{/user/profile}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Full Name</label>
                                <input type="text" class="form-control" name="fullName" th:value="${user.fullName}" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Email Address (Read-only)</label>
                                <input type="email" class="form-control bg-light" th:value="${user.email}" readonly />
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Mobile Number</label>
                                <input type="tel" class="form-control" name="phone" th:value="${user.phone}" required />
                            </div>

                            <button type="submit" class="btn btn-navy w-100">
                                <i class="bi bi-check2 me-1"></i> Update Profile Details
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Vehicles Management -->
                <div class="col-lg-7">
                    <div class="card card-modern p-4 mb-4 shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold text-dark mb-0">Registered Electric Vehicles</h5>
                            <button type="button" class="btn btn-electric btn-sm" data-bs-toggle="collapse" data-bs-target="#addVehicleForm">
                                <i class="bi bi-plus-circle me-1"></i> Add Vehicle
                            </button>
                        </div>

                        <!-- Add Vehicle Form (Collapsible) -->
                        <div class="collapse mb-4" id="addVehicleForm">
                            <div class="card bg-light border p-3">
                                <h6 class="fw-bold text-dark mb-2">Register New Vehicle</h6>
                                <form th:action="@{/user/vehicle/add}" th:object="${newVehicle}" method="post" class="row g-2">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                    <div class="col-md-6">
                                        <label class="form-label small text-muted">Reg Number</label>
                                        <input type="text" class="form-control form-control-sm" th:field="*{registrationNumber}" placeholder="KL-13-AQ-4521" required />
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small text-muted">Brand / Make</label>
                                        <input type="text" class="form-control form-control-sm" th:field="*{make}" placeholder="Tata, MG, Ather" required />
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Model</label>
                                        <input type="text" class="form-control form-control-sm" th:field="*{model}" placeholder="Nexon EV" required />
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Vehicle Type</label>
                                        <select class="form-select form-select-sm" th:field="*{vehicleType}" required>
                                            <option value="4-Wheeler SUV">4-Wheeler SUV</option>
                                            <option value="4-Wheeler Sedan">4-Wheeler Sedan</option>
                                            <option value="2-Wheeler Scooter">2-Wheeler Scooter</option>
                                            <option value="Commercial EV">Commercial EV</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted">Preferred Connector</label>
                                        <select class="form-select form-select-sm" th:field="*{preferredConnector}" required>
                                            <option value="CCS2">CCS2</option>
                                            <option value="Type 2">Type 2</option>
                                            <option value="CHAdeMO">CHAdeMO</option>
                                        </select>
                                    </div>
                                    <div class="col-12 mt-2">
                                        <button type="submit" class="btn btn-success btn-sm px-3">Save Vehicle</button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- Existing Vehicles List -->
                        <div th:if="${#lists.isEmpty(user.vehicles)}" class="alert alert-light text-center py-4 border">
                            No vehicles currently registered in your account.
                        </div>

                        <div th:unless="${#lists.isEmpty(user.vehicles)}" class="table-responsive">
                            <table class="table table-hover align-middle border-0 mb-0">
                                <thead class="table-light small">
                                    <tr>
                                        <th>Reg Number</th>
                                        <th>Make &amp; Model</th>
                                        <th>Type</th>
                                        <th>Connector</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="v : ${user.vehicles}">
                                        <td class="fw-bold font-monospace" th:text="${v.registrationNumber}">KL-13-AQ-4521</td>
                                        <td th:text="${v.make + ' ' + v.model}">Tata Nexon EV</td>
                                        <td th:text="${v.vehicleType}">4-Wheeler SUV</td>
                                        <td>
                                            <span class="badge bg-primary bg-opacity-10 text-primary border" th:text="${v.preferredConnector}">CCS2</span>
                                        </td>
                                        <td>
                                            <form th:action="@{'/user/vehicle/delete/' + ${v.id}}" method="post" onsubmit="return confirm('Remove this vehicle?');">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete Vehicle">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
