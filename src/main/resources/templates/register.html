<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Register Account')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card card-modern shadow-lg p-4 p-sm-5 border-0">
                        <div class="text-center mb-4">
                            <div class="stat-icon green mx-auto mb-2" style="width: 58px; height: 58px;">
                                <i class="bi bi-person-plus-fill fs-3"></i>
                            </div>
                            <h3 class="fw-bold text-dark">Create Your EV Account</h3>
                            <p class="text-muted small">Register your profile and EV details for seamless charging slot reservations</p>
                        </div>

                        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <!-- Section 1: Personal Information -->
                            <h5 class="fw-bold text-primary mb-3 pb-2 border-bottom">
                                <i class="bi bi-person me-2"></i>Personal Details
                            </h5>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{fullName}" placeholder="Rahul Sharma" required />
                                    <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" th:field="*{email}" placeholder="rahul@example.com" required />
                                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">Mobile Number <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" th:field="*{phone}" placeholder="+91 98470 12345" required />
                                    <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" th:field="*{password}" placeholder="Min 6 characters" required />
                                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">Confirm Password <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" th:field="*{confirmPassword}" placeholder="Re-enter password" required />
                                    <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                                </div>
                            </div>

                            <!-- Section 2: Vehicle Information -->
                            <h5 class="fw-bold text-primary mb-3 pb-2 border-bottom">
                                <i class="bi bi-ev-station me-2"></i>Electric Vehicle Information
                            </h5>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Registration Number <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{registrationNumber}" placeholder="KL-13-AQ-4521" required />
                                    <div class="text-danger small" th:if="${#fields.hasErrors('registrationNumber')}" th:errors="*{registrationNumber}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Vehicle Brand / Make <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{make}" placeholder="e.g. Tata, MG, Ather, Hyundai" required />
                                    <div class="text-danger small" th:if="${#fields.hasErrors('make')}" th:errors="*{make}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">Vehicle Model <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{model}" placeholder="e.g. Nexon EV, 450X" required />
                                    <div class="text-danger small" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">Vehicle Type <span class="text-danger">*</span></label>
                                    <select class="form-select" th:field="*{vehicleType}" required>
                                        <option value="4-Wheeler SUV">4-Wheeler SUV</option>
                                        <option value="4-Wheeler Sedan">4-Wheeler Sedan</option>
                                        <option value="4-Wheeler Hatchback">4-Wheeler Hatchback</option>
                                        <option value="2-Wheeler Scooter/Bike">2-Wheeler Scooter/Bike</option>
                                        <option value="Commercial EV">Commercial EV</option>
                                    </select>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('vehicleType')}" th:errors="*{vehicleType}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small">Preferred Connector <span class="text-danger">*</span></label>
                                    <select class="form-select" th:field="*{preferredConnector}" required>
                                        <option value="CCS2">CCS2 (Fast DC - Most Modern 4W)</option>
                                        <option value="Type 2">Type 2 (AC Fast - 2W &amp; 4W)</option>
                                        <option value="CHAdeMO">CHAdeMO (Fast DC)</option>
                                        <option value="Bharat AC-001">Bharat AC-001</option>
                                    </select>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('preferredConnector')}" th:errors="*{preferredConnector}"></div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-electric w-100 py-2 fs-6">
                                <i class="bi bi-check2-circle me-1"></i> Register &amp; Start Charging
                            </button>
                        </form>

                        <div class="text-center mt-4 small text-muted">
                            Already registered? 
                            <a th:href="@{/login}" class="text-decoration-none fw-bold text-success">Sign In here</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
