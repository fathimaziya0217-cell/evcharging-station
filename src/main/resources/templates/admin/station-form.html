<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Station Form')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <div class="card card-modern p-4 p-md-5 shadow-sm">
                        <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                            <div>
                                <h3 class="fw-bold mb-1" th:text="${stationForm.id != null ? 'Edit Charging Station' : 'Add New Charging Station'}">Station Form</h3>
                                <p class="text-muted small mb-0">Enter station identity, precise GPS coordinates, hours, and conveniences.</p>
                            </div>
                            <a th:href="@{/admin/stations}" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-arrow-left me-1"></i> Back to Stations
                            </a>
                        </div>

                        <form th:action="@{/admin/stations/save}" th:object="${stationForm}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" th:field="*{id}" />

                            <!-- Basic Info -->
                            <div class="row g-3 mb-4">
                                <div class="col-md-8">
                                    <label class="form-label small fw-bold">Station Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{name}" placeholder="e.g. EV Charge Caltex Hub" required />
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold">Operational Status</label>
                                    <select class="form-select" th:field="*{status}">
                                        <option value="ACTIVE">ACTIVE</option>
                                        <option value="INACTIVE">INACTIVE</option>
                                        <option value="UNDER_MAINTENANCE">UNDER_MAINTENANCE</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-bold">Description</label>
                                    <textarea class="form-control" th:field="*{description}" rows="2" placeholder="Brief description of the facility..."></textarea>
                                </div>
                            </div>

                            <!-- Address & Location -->
                            <h5 class="fw-bold text-primary mb-3 pb-2 border-bottom"><i class="bi bi-geo-alt me-2"></i>Location &amp; Coordinates</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">Street Address <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{address}" required />
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Area / Locality <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{area}" required />
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">City <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{city}" required />
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label small fw-bold">State <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{state}" required />
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label small fw-bold">Postal Code <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{postalCode}" required />
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Latitude <span class="text-danger">*</span></label>
                                    <input type="number" step="any" class="form-control" th:field="*{latitude}" placeholder="11.874477" required />
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Longitude <span class="text-danger">*</span></label>
                                    <input type="number" step="any" class="form-control" th:field="*{longitude}" placeholder="75.370369" required />
                                </div>
                            </div>

                            <!-- Operations & Hours -->
                            <h5 class="fw-bold text-primary mb-3 pb-2 border-bottom"><i class="bi bi-clock me-2"></i>Operation Details &amp; Amenities</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Opening Time</label>
                                    <input type="time" class="form-control" th:field="*{openingTime}" />
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Closing Time</label>
                                    <input type="time" class="form-control" th:field="*{closingTime}" />
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Operating Days</label>
                                    <input type="text" class="form-control" th:field="*{operatingDays}" placeholder="All Days / Mon-Sat" />
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Contact Phone <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{contactNumber}" required />
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">Parking Information</label>
                                    <input type="text" class="form-control" th:field="*{parkingInformation}" placeholder="e.g. Dedicated 4-bay EV parking with canopy" />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">Amenities (Comma separated)</label>
                                    <input type="text" class="form-control" th:field="*{amenitiesCsv}" placeholder="Restroom, Free Wi-Fi, Café, 24/7 Security" />
                                </div>

                                <div class="col-12 mt-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" th:field="*{demo}" id="isDemo">
                                        <label class="form-check-label small fw-semibold" for="isDemo">
                                            Mark as Demo Station (Displays DEMO DATA banner on card)
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-electric w-100 py-2 fs-6">
                                <i class="bi bi-save me-1"></i> Save Charging Station
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
