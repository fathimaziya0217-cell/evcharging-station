<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Audit Logs')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-4">
        <div class="container-fluid px-lg-5">
            <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                <div>
                    <h3 class="fw-bold mb-1"><i class="bi bi-shield-check text-primary me-2"></i>System Security &amp; Audit Trail</h3>
                    <p class="text-muted small mb-0">Traceable historical log of all administrative interventions, station edits, cancellations, and status alterations.</p>
                </div>
            </div>

            <div class="card card-modern p-4 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle border-0 mb-0 small">
                        <thead class="table-light">
                            <tr>
                                <th>Log ID</th>
                                <th>Admin User</th>
                                <th>Action Taken</th>
                                <th>Entity Affected</th>
                                <th>Details</th>
                                <th>IP Address</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="l : ${logs}">
                                <td class="font-monospace fw-bold" th:text="${l.id}">1</td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${l.adminName}">Admin</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border font-monospace" th:text="${l.action}">ACTION</span>
                                </td>
                                <td>
                                    <span class="fw-semibold text-primary" th:text="${l.entityType + ' #' + l.entityId}">STATION #1</span>
                                </td>
                                <td class="text-dark" th:text="${l.details}">Details of operation</td>
                                <td class="font-monospace text-muted" th:text="${l.ipAddress}">127.0.0.1</td>
                                <td class="text-muted" th:text="${l.createdAt}">Date</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
