<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('System Settings')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-4">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                <div>
                    <h3 class="fw-bold mb-1"><i class="bi bi-sliders text-primary me-2"></i>System Application Settings</h3>
                    <p class="text-muted small mb-0">Manage global operational thresholds, cancellation window, timeouts, and contact channels.</p>
                </div>
            </div>

            <div class="card card-modern p-4 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle border-0 mb-0">
                        <thead class="table-light small">
                            <tr>
                                <th>Setting Key</th>
                                <th>Current Configured Value</th>
                                <th>Description</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="st : ${settingsList}">
                                <td class="fw-bold font-monospace text-dark" th:text="${st.settingKey}">KEY</td>
                                <td>
                                    <form th:action="@{/admin/settings/save}" method="post" class="d-flex gap-2">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <input type="hidden" name="settingKey" th:value="${st.settingKey}" />
                                        <input type="text" class="form-control form-control-sm" name="settingValue" th:value="${st.settingValue}" required />
                                        <button type="submit" class="btn btn-navy btn-sm flex-shrink-0">Save</button>
                                    </form>
                                </td>
                                <td class="small text-muted" th:text="${st.description}">Description</td>
                                <td>
                                    <span class="badge bg-light text-secondary border small" style="font-size: 0.68rem;" th:text="${st.updatedAt}">Timestamp</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
