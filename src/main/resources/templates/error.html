<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Application Error')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="py-5">
        <div class="container text-center">
            <div class="py-5">
                <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 5rem;"></i>
                <h2 class="fw-bold text-dark mt-3" th:text="${errorCode != null ? 'Error ' + errorCode : 'Something Went Wrong'}">Error</h2>
                <p class="text-muted fs-5 mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested resource could not be found or an internal error occurred.'}">
                    Error message description
                </p>
                <div class="d-flex gap-2 justify-content-center">
                    <a th:href="@{/}" class="btn btn-navy px-4">
                        <i class="bi bi-house me-1"></i> Return Home
                    </a>
                    <a th:href="@{/stations}" class="btn btn-electric px-4">
                        <i class="bi bi-geo-alt me-1"></i> Find Stations
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
