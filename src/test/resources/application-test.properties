spring.application.name=ev-charging-station-management-test

# Use in-memory H2 database with MySQL mode for fast isolated tests
spring.datasource.url=jdbc:h2:mem:ev_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Disable Flyway for tests; schema-test.sql will initialize tables
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql

# Thymeleaf & Session
spring.thymeleaf.cache=false

# Test App Properties
app.admin.name=System Administrator
app.admin.email=admin@evcharge.com
app.admin.password=Admin@12345
app.admin.phone=+919876543210

app.payment.mode=DEMO
app.payment.razorpay.key-id=rzp_test_placeholder
app.payment.razorpay.key-secret=secret_placeholder
app.payment.razorpay.webhook-secret=webhook_placeholder

logging.level.com.evcharging=DEBUG
